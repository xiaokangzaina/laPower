name: Windows portable release fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify and package v0.2.10 Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.2.10
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify release source and install locked tooling
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '6af6be2a22262598c81951ed62bfc0ebfcf02340') {
              throw 'Unexpected release tag commit.'
          }
          if ((node -p "require('./package.json').version") -ne '0.2.10') {
              throw 'Unexpected package version.'
          }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: package-x86_64-pc-windows-msvc

      - name: Build the portable application
        shell: pwsh
        run: npm run build:app -- --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Create and verify the portable ZIP
        shell: pwsh
        run: |
          $archive = Get-Item -LiteralPath (./scripts/package-portable-windows.ps1)
          $output = New-Item -ItemType Directory -Force -Path 'dist/packages'
          Copy-Item -LiteralPath $archive.FullName -Destination $output.FullName
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath (Join-Path $output.FullName 'SHA256SUMS') -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-v0.2.10
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
